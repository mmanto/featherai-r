[package]
name = "featherai"
version = "0.1.4"
authors = ["Martín Mantovani <martin.mantovani@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[dependencies]
dioxus = { version = "0.7.1", features = ["router"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Hashing argon2 PHC para usuarios persistidos (seed admin/admin).
argon2 = "0.5"

# Solo web: fecha del navegador para el pie de página (SystemTime panica
# en wasm32-unknown-unknown desde Rust 1.89).
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

# Persistencia local-first (GuardianDB sobre Iroh) — solo desktop/nativo.
# GuardianDB ya exige tokio "full"; el runtime se crea en `init_backend`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
guardian-db = { version = "0.20.26", features = ["sentinel"] }
tokio = { version = "1.53", features = ["full"] }
# Ids uuid v4 asignados por la capa de servicios al persistir (el feature
# v4 no compila a wasm32 y acá no hay persistencia).
uuid = { version = "1", features = ["v4"] }
# Habilita `OsRng` en el rand_core 0.6 que usa argon2/password-hash
# (salt generation en `services::auth`) vía unificación de features.
rand_core = { version = "0.6", features = ["getrandom"] }

# Red de pares (`src/net.rs`): los tipos de Iroh (EndpointId) y el
# descubrimiento mDNS de nodos feathrai en la red interna. Mismas versiones
# que las que ya resuelve guardian-db (Cargo.lock las fija).
iroh = "1.1"
iroh-mdns-address-lookup = "0.4"
# `StreamExt::next` del stream de descubrimiento mDNS; ya está en el árbol
# vía iroh/guardian-db.
futures-lite = "2"
# Log de red opt-in (`FEATHRAI_LOG=info|debug|trace`): trazas de iroh/
# guardian-db al `<data dir>/featherai.log`. Sin la variable no se instala.
tracing-subscriber = { version = "0.3", features = ["fmt"] }

# Workarounds de renderizado de WebKitGTK con el driver propietario de NVIDIA
# (en X11 deja la ventana en gris; en Wayland rompe el sync explícito). Sin
# dependencias: detecta driver y sesión por sysfs/env. Ver `quirk_webkit`.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk-nvidia-quirk = "2"

# `getuid` para el data dir interno de Android
# (`/data/user/<usuario>/<package>/files`): el uid ubica el directorio del
# usuario que corre el proceso. Ya está en el árbol vía tokio/guardian-db.
[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

# NOTA (Windows): `wmi` (iroh -> netwatch) declara `windows` y `windows-core`
# como rangos anchos e independientes (">=0.59, <0.63"); si Cargo los resuelve
# en minors distintos el crate no compila ("multiple different versions of
# crate `windows_core` in the dependency graph"). Cargo.lock los fija a
# 0.62.2/0.62.2; al actualizar dependencias, revalidar en Windows con
# `cargo check -p wmi --target x86_64-pc-windows-msvc`.

[features]
default = ["desktop"]
# The feature that are only required for the web = ["dioxus/web"] build target should be optional and only enabled in the web = ["dioxus/web"] feature
web = ["dioxus/web"]
# The feature that are only required for the desktop = ["dioxus/desktop"] build target should be optional and only enabled in the desktop = ["dioxus/desktop"] feature
desktop = ["dioxus/desktop"]
# The feature that are only required for the mobile = ["dioxus/mobile"] build target should be optional and only enabled in the mobile = ["dioxus/mobile"] feature
mobile = ["dioxus/mobile"]
# The feature that are only required for the server = ["dioxus/server"] build target should be optional and only enabled in the server = ["dioxus/server"] feature
server = ["dioxus/server"]

[dev-dependencies]
tempfile = "3"
